<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مسبحتي — عدّاد تسبيح</title>
<meta name="theme-color" content="#0e4d2e">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,'Segoe UI',Tahoma,sans-serif;background:#0b3520;color:#f5f0e1;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px}
h1{margin:8px 0 2px;font-size:28px;color:#d4af37}
.sub{opacity:.8;font-size:14px;margin-bottom:18px}
.dhikr{font-size:24px;margin:10px 0;color:#ffe9a8;min-height:32px}
.count{font-size:96px;font-weight:800;line-height:1;margin:6px 0;color:#fff}
.target{opacity:.85;font-size:15px;margin-bottom:14px}
.tap{width:230px;height:230px;border-radius:50%;border:6px solid #d4af37;background:radial-gradient(circle at 35% 30%,#177a48,#0e4d2e 70%);color:#fff;font-size:26px;font-weight:700;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.45);touch-action:manipulation}
.tap:active{transform:scale(.97)}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:18px 0 8px}
.chip{background:#14532d;color:#f5f0e1;border:1px solid #d4af37;border-radius:999px;padding:9px 14px;font-size:15px;cursor:pointer}
.chip.on{background:#d4af37;color:#0b3520;font-weight:700}
.tools{display:flex;gap:10px;margin-top:10px}
.btn{background:transparent;color:#f5f0e1;border:1px solid #9db8a6;border-radius:10px;padding:9px 18px;font-size:15px;cursor:pointer}
.total{margin-top:16px;opacity:.85;font-size:14px}
</style>
</head>
<body>
<h1>📿 مسبحتي</h1>
<div class="sub">عدّاد تسبيح بسيط — اضغط الدائرة للعدّ</div>
<div class="row" id="chips"></div>
<div class="dhikr" id="dhikr">سبحان الله</div>
<div class="count" id="count">0</div>
<div class="target" id="target">الهدف: 33</div>
<button class="tap" id="tap">سبِّح</button>
<div class="tools">
<button class="btn" id="reset">↺ تصفير الجولة</button>
<button class="btn" id="resetAll">تصفير الكل</button>
</div>
<div class="total">مجموع الجولات المكتملة: <b id="rounds">0</b> · مجموع التسبيحات: <b id="total">0</b></div>
<script>
const ADHKAR=[['سبحان الله',33],['الحمد لله',33],['الله أكبر',34],['لا إله إلا الله',100],['أستغفر الله',100],['اللهم صلّ على محمد',100]];
let idx=0,count=0,rounds=0,total=0;
const $=id=>document.getElementById(id);
const chips=$('chips');
ADHKAR.forEach((a,i)=>{const b=document.createElement('button');b.className='chip'+(i===0?' on':'');b.textContent=a[0]+' · '+a[1];b.onclick=()=>{idx=i;count=0;document.querySelectorAll('.chip').forEach((c,j)=>c.classList.toggle('on',j===i));render()};chips.appendChild(b)});
function render(){$('dhikr').textContent=ADHKAR[idx][0];$('count').textContent=count;$('target').textContent='الهدف: '+ADHKAR[idx][1];$('rounds').textContent=rounds;$('total').textContent=total}
$('tap').onclick=()=>{count++;total++;if(count>=ADHKAR[idx][1]){rounds++;count=0;if(navigator.vibrate)navigator.vibrate(120)}render()};
$('reset').onclick=()=>{total-=count;count=0;render()};
$('resetAll').onclick=()=>{count=0;rounds=0;total=0;render()};
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js');
</script>
</body>
</html>
